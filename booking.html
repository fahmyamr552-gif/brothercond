<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حجز صيانة - برازر كوند للتكييف</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0f2347">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo','Segoe UI',Tahoma,sans-serif;background:#f4f6f9;color:#0f1b33;padding:16px;min-height:100vh}
.card{max-width:480px;margin:0 auto;background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.08);overflow:hidden}
.hd{background:linear-gradient(180deg,#eaf4fc,#fff);color:#0f2347;padding:22px 20px 18px;text-align:center;position:relative;border-bottom:1px solid #e3e8ef}
.hd .lg{width:150px;height:auto;display:block;margin:0 auto 10px}
.back{position:absolute;top:14px;inset-inline-start:14px;color:#1c5fa8;font-size:12px;font-weight:700;text-decoration:none;padding:6px 4px}
.hd h1{font-size:20px;font-weight:800}
.hd p{font-size:13px;opacity:.92;margin-top:4px}
.lang-btn{position:absolute;top:14px;inset-inline-end:14px;background:#fff;color:#0f2347;border:1px solid #c9d2dc;font-family:inherit;border-radius:8px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer}
.body{padding:20px}
label{display:block;font-size:13px;font-weight:700;color:#444;margin:14px 0 5px}
.req{color:#c0392b}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #ddd;border-radius:10px;font-size:14px;font-family:inherit;background:#fafafa}
input:focus,select:focus,textarea:focus{outline:none;border-color:#0f2347;background:#fff}
textarea{resize:vertical;min-height:70px}
.btn{width:100%;margin-top:20px;padding:14px;background:#0f2347;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:800;cursor:pointer}
.btn:disabled{opacity:.6}
.ok{text-align:center;padding:40px 20px;display:none}
.ok .ic{font-size:56px;margin-bottom:12px}
.ok h2{color:#1c5fa8;font-size:22px;margin-bottom:8px}
.ok p{color:#666;font-size:14px;line-height:1.6}
.modebar{display:flex;gap:8px;padding:14px 20px 0}
.modebar button{flex:1;padding:10px;border:1px solid #cfe3f2;background:#f1f7fc;color:#1c5fa8;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}
.modebar button.on{background:#0f2347;color:#fff;border-color:#0f2347}
.ok h2{color:#0f2347!important}
.foot{text-align:center;font-size:11px;color:#999;padding:14px}
.err{background:#FCEBEB;color:#A32D2D;border-radius:8px;padding:10px;font-size:13px;margin-top:12px;display:none}
#ac-section{margin-top:14px;background:#f1f7fc;border:1px solid #cfe3f2;border-radius:12px;padding:14px}
#ac-section .ttl{font-size:13px;font-weight:800;color:#1c5fa8;margin-bottom:10px}
.ac-row{background:#fff;border:1px solid #e0ddd8;border-radius:10px;padding:10px;margin-bottom:10px;position:relative}
.ac-row .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ac-row label{margin:6px 0 3px;font-size:11px;color:#666}
.ac-row select,.ac-row input{padding:8px 10px;font-size:13px}
.ac-del{position:absolute;top:8px;inset-inline-start:8px;background:#FCEBEB;color:#A32D2D;border:none;border-radius:6px;width:26px;height:26px;font-size:15px;cursor:pointer;line-height:1}
.add-ac{width:100%;padding:10px;background:#eaf4fc;color:#1c5fa8;border:1px dashed #0f2347;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer}
</style>
</head>

  el("f-address").placeholder=t.ph_address;el("f-from-address").placeholder=t.ph_from;el("f-to-address").placeholder=t.ph_to;
  el("f-problem").placeholder=t.ph_problem;
  fillSelect(el("f-branch"),t.branches,true);
  fillSelect(el("f-service"),t.services,true);
  fillSelect(el("f-time"),t.times,true);
  // relabel existing AC rows
  document.querySelectorAll("#ac-rows .ac-row").forEach(relabelAcRow);
}
function toggleLang(){LANG=(LANG==="ar"?"en":"ar");applyLang();cApplyLang();bcBack();try{localStorage.setItem("bc_site_lang",LANG);}catch(e){}}
function bcBack(){var b=document.getElementById("back-home");if(b)b.textContent=(LANG==="ar"?"→ الرئيسية":"← Home");}
// ── complaints ──
var CT={ar:{book:"حجز خدمة",comp:"تقديم شكوى",name:"الاسم",phone:"رقم الهاتف",address:"العنوان",type:"نوع الشكوى",desc:"تفاصيل الشكوى",submit:"إرسال الشكوى",sending:"جاري الإرسال...",
    okh:"تم استلام شكواك",okp:"رقم الشكوى: {n}<br><br>سيتواصل معك فريق برازر كوند في أقرب وقت.<br><br>للاستعجال: 01222211310",req:"برجاء إدخال الاسم ورقم الهاتف وتفاصيل الشكوى",fail:"تعذر إرسال الشكوى، برجاء المحاولة مرة أخرى أو الاتصال بنا"},
  en:{book:"Book a service",comp:"Submit a complaint",name:"Name",phone:"Phone number",address:"Address",type:"Complaint type",desc:"Complaint details",submit:"Send complaint",sending:"Sending...",
    okh:"We received your complaint",okp:"Complaint number: {n}<br><br>The BrotherCond team will contact you shortly.<br><br>Urgent: 01222211310",req:"Please enter your name, phone number and the complaint details",fail:"Could not send the complaint. Please try again or call us"}};
var CTYPES=[["ac_not_working","تكييف لا يعمل بعد التركيب","AC not working after installation"],["fault","عطل فني / صيانة سيئة","Technical fault / poor maintenance"],["install_delay","تأخير أو مشكلة في التركيب","Installation delay or problem"],["maint_delay","تأخير موعد الصيانة","Maintenance appointment delayed"],["warranty","مطالبة ضمان","Warranty claim"],["parts","قطع غيار","Spare parts"],["sales_complaint","شكوى مبيعات / تسعير","Sales / pricing complaint"],["inquiry","استفسار عام","General inquiry"]];
var MODE="book";
function cApplyLang(){
  var t=CT[LANG]||CT.ar,g=function(id){return document.getElementById(id);};
  g("mode-book").textContent=t.book;g("mode-comp").textContent=t.comp;
  var star=' <span class="req">*</span>';
  g("cl-name").innerHTML=t.name+star;g("cl-phone").innerHTML=t.phone+star;g("cl-address").textContent=t.address;
  g("cl-type").innerHTML=t.type+star;g("cl-desc").innerHTML=t.desc+star;g("c-submit").textContent=t.submit;
  var sel=g("c-type"),cur=sel.value;sel.innerHTML="";
  CTYPES.forEach(function(x){var o=document.createElement("option");o.value=x[0];o.textContent=(LANG==="en"?x[2]:x[1]);sel.appendChild(o);});
  if(cur)sel.value=cur;
}
function setMode(m){
  MODE=m;var g=function(id){return document.getElementById(id);};
  g("mode-book").className=(m==="book"?"on":"");g("mode-comp").className=(m==="comp"?"on":"");
  g("form-area").style.display=(m==="book"?"block":"none");g("comp-area").style.display=(m==="comp"?"block":"none");
}
async function submitComplaint(){
  var t=CT[LANG]||CT.ar,g=function(id){return document.getElementById(id);};
  var err=g("c-err");err.style.display="none";
  var name=g("c-name").value.trim(),phone=g("c-phone").value.trim(),desc=g("c-desc").value.trim();
  if(name.length<2||phone.replace(/[^0-9٠-٩]/g,"").length<8||desc.length<5){err.textContent=t.req;err.style.display="block";return;}
  var ar="٠١٢٣٤٥٦٧٨٩";phone=phone.replace(/[٠-٩]/g,function(d){return ar.indexOf(d);});
  var btn=g("c-submit");btn.disabled=true;btn.textContent=t.sending;
  try{
    var r=await db.rpc("case_create_public",{p_name:name,p_phone:phone,p_address:g("c-address").value.trim(),p_type:g("c-type").value,p_description:desc});
    if(r.error)throw r.error;
    g("comp-area").style.display="none";g("modebar").style.display="none";g("lang-btn").style.display="none";
    g("t-okh").textContent=t.okh;g("t-okp").innerHTML=t.okp.replace("{n}","<b>"+r.data+"</b>");
    g("ok-area").style.display="block";
  }catch(e){
    var m=(e&&e.message)||"";
    err.textContent=(/[\u0600-\u06FF]/.test(m)?m:t.fail);err.style.display="block";
    btn.disabled=false;btn.textContent=t.submit;
  }
}
cApplyLang();
function relabelAcRow(r){
  var t=T[LANG];
  r.querySelector(".lb-brand").textContent=t.ac_brand;
  r.querySelector(".lb-hp").textContent=t.ac_hp;
  r.querySelector(".lb-cool").textContent=t.ac_cool;
  r.querySelector(".lb-qty").textContent=t.ac_qty;
  // rebuild option labels but keep selected index
  var bs=r.querySelector(".ac-brand");var bi=bs.selectedIndex;
  bs.innerHTML='<option value="">'+t.pick_brand+'</option>'+BRAND_VAL.map(function(v,i){return '<option value="'+v+'">'+t.brands[i]+'</option>';}).join("");
  bs.selectedIndex=bi<0?0:bi;
  var hs=r.querySelector(".ac-hp");var hi=hs.selectedIndex;
  hs.innerHTML='<option value="">'+t.pick_hp+'</option>'+HP_VAL.map(function(v,i){return '<option value="'+v+'">'+t.hps[i]+'</option>';}).join("");
  hs.selectedIndex=hi<0?0:hi;
  var cs=r.querySelector(".ac-cool");var ci=cs.selectedIndex;
  cs.innerHTML='<option value="">'+t.pick_cool+'</option><option value="بارد">'+t.cool_c+'</option><option value="بارد/ساخن">'+t.cool_ch+'</option>';
  cs.selectedIndex=ci<0?0:ci;
  r.querySelector(".ac-qty").placeholder=t.ph_qty;
}
function addAc(){
  var i=acCount++;var t=T[LANG];
  var div=document.createElement("div");div.className="ac-row";div.id="ac-"+i;
  div.innerHTML=
    '<button type="button" class="ac-del" onclick="document.getElementById(\'ac-'+i+'\').remove()">✕</button>'
    +'<div class="grid">'
      +'<div><label class="lb-brand"></label><select class="ac-brand"></select></div>'
      +'<div><label class="lb-hp"></label><select class="ac-hp"></select></div>'
      +'<div><label class="lb-cool"></label><select class="ac-cool"></select></div>'
      +'<div><label class="lb-qty"></label><input class="ac-qty" type="number" min="1" inputmode="numeric"></div>'
    +'</div>';
  el("ac-rows").appendChild(div);
  relabelAcRow(div);
}
function onServiceChange(){
  var s=el("f-service").value;var two=(s==="فك و تركيب");
  el("two-addr-block").style.display=two?"block":"none";
  el("single-addr-block").style.display=two?"none":"block";
}
function collectAc(){
  var rows=document.querySelectorAll("#ac-rows .ac-row");var out=[];
  rows.forEach(function(r){
    var brand=r.querySelector(".ac-brand").value;var hp=r.querySelector(".ac-hp").value;
    var cool=r.querySelector(".ac-cool").value;var qty=parseInt(r.querySelector(".ac-qty").value)||1;
    // Skip fully-empty rows; include a row only if the customer filled something
    if(!brand&&!hp&&!cool)return;
    out.push(qty+" × "+[brand,hp,cool].filter(Boolean).join(" "));
  });
  return out.join("\n");
}
async function submitBooking(){
  var t=T[LANG];var err=el("err");err.style.display="none";
  var fname=el("f-fname").value.trim();var lname=el("f-lname").value.trim();
  var name=(fname+" "+lname).trim();var phone=toEnDigits(el("f-phone").value);
  if(!fname){err.textContent=t.e_fname;err.style.display="block";return;}
  if(!lname){err.textContent=t.e_lname;err.style.display="block";return;}
  if(!phone||phone.length<10){err.textContent=t.e_phone;err.style.display="block";return;}
  var service=el("f-service").value;var isTwo=(service==="فك و تركيب");
  var address="",fromAddr="",toAddr="";
  if(isTwo){
    fromAddr=el("f-from-address").value.trim();toAddr=el("f-to-address").value.trim();
    if(!fromAddr){err.textContent=t.e_from;err.style.display="block";return;}
    if(!toAddr){err.textContent=t.e_to;err.style.display="block";return;}
    address=fromAddr;
  }else{
    address=el("f-address").value.trim();
    if(!address){err.textContent=t.e_addr;err.style.display="block";return;}
  }
  var branch=el("f-branch").value;
  if(!branch){err.textContent=t.e_branch;err.style.display="block";return;}
  if(!service){err.textContent=t.e_service;err.style.display="block";return;}
  // AC units are OPTIONAL — many customers don't know their brand/capacity.
  // We only validate rows the customer partially filled, so a blank section is fine.
  var problem=el("f-problem").value.trim();
  if(!problem){err.textContent=t.e_problem;err.style.display="block";return;}
  var pdate=el("f-date").value;var ptime=el("f-time").value;
  if(!pdate){err.textContent=t.e_date;err.style.display="block";return;}
  if(!ptime){err.textContent=t.e_time;err.style.display="block";return;}
  var btn=el("submit-btn");btn.disabled=true;btn.textContent=t.sending;
  var row={customer_name:name,phone:phone,address:address,from_address:fromAddr||null,to_address:toAddr||null,
    branch:branch,service_type:service,problem:problem,ac_units:collectAc()||null,
    preferred_date:pdate,preferred_time:ptime,status:"new"};
  var r=await db.from("booking_requests").insert(row);
  if(r.error){err.textContent=t.e_err;err.style.display="block";btn.disabled=false;btn.textContent=t.submit;return;}
  el("form-area").style.display="none";document.getElementById("modebar").style.display="none";el("ok-area").style.display="block";
}
