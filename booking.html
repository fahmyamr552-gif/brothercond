<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حجز صيانة - برازر كوند للتكييف</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f4f6f8;color:#1a1a1a;padding:16px;min-height:100vh}
.card{max-width:480px;margin:0 auto;background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.08);overflow:hidden}
.hd{background:linear-gradient(135deg,#0F6E56,#1D9E75);color:#fff;padding:24px 20px;text-align:center;position:relative}
.hd img{width:80px;height:80px;object-fit:contain;background:#fff;border-radius:12px;padding:6px;margin-bottom:10px}
.hd h1{font-size:20px;font-weight:800}
.hd p{font-size:13px;opacity:.92;margin-top:4px}
.lang-btn{position:absolute;top:14px;inset-inline-end:14px;background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:8px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer}
.body{padding:20px}
label{display:block;font-size:13px;font-weight:700;color:#444;margin:14px 0 5px}
.req{color:#c0392b}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #ddd;border-radius:10px;font-size:14px;font-family:inherit;background:#fafafa}
input:focus,select:focus,textarea:focus{outline:none;border-color:#1D9E75;background:#fff}
textarea{resize:vertical;min-height:70px}
.btn{width:100%;margin-top:20px;padding:14px;background:#1D9E75;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:800;cursor:pointer}
.btn:disabled{opacity:.6}
.ok{text-align:center;padding:40px 20px;display:none}
.ok .ic{font-size:56px;margin-bottom:12px}
.ok h2{color:#0F6E56;font-size:22px;margin-bottom:8px}
.ok p{color:#666;font-size:14px;line-height:1.6}
.foot{text-align:center;font-size:11px;color:#999;padding:14px}
.err{background:#FCEBEB;color:#A32D2D;border-radius:8px;padding:10px;font-size:13px;margin-top:12px;display:none}
#ac-section{margin-top:14px;background:#f0f9f4;border:1px solid #cdeadd;border-radius:12px;padding:14px}
#ac-section .ttl{font-size:13px;font-weight:800;color:#0F6E56;margin-bottom:10px}
.ac-row{background:#fff;border:1px solid #e0ddd8;border-radius:10px;padding:10px;margin-bottom:10px;position:relative}
.ac-row .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ac-row label{margin:6px 0 3px;font-size:11px;color:#666}
.ac-row select,.ac-row input{padding:8px 10px;font-size:13px}
.ac-del{position:absolute;top:8px;inset-inline-start:8px;background:#FCEBEB;color:#A32D2D;border:none;border-radius:6px;width:26px;height:26px;font-size:15px;cursor:pointer;line-height:1}
.add-ac{width:100%;padding:10px;background:#EAF3DE;color:#0F6E56;border:1px dashed #1D9E75;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer}
</style>
</head>

function collectAc(){
  var rows=document.querySelectorAll("#ac-rows .ac-row");var out=[];
  rows.forEach(function(r){
    var brand=r.querySelector(".ac-brand").value;var hp=r.querySelector(".ac-hp").value;
    var cool=r.querySelector(".ac-cool").value;var qty=parseInt(r.querySelector(".ac-qty").value)||1;
    out.push(qty+" × "+brand+" "+hp+" "+cool);
  });
  return out.join("\n");
}
async function submitBooking(){
  var t=T[LANG];var err=el("err");err.style.display="none";
  var fname=el("f-fname").value.trim();var lname=el("f-lname").value.trim();
  var name=(fname+" "+lname).trim();var phone=toEnDigits(el("f-phone").value);
  if(!fname){err.textContent=t.e_fname;err.style.display="block";return;}
  if(!lname){err.textContent=t.e_lname;err.style.display="block";return;}
  if(!phone||phone.length<10){err.textContent=t.e_phone;err.style.display="block";return;}
  var service=el("f-service").value;var isTwo=(service==="فك و تركيب");
  var address="",fromAddr="",toAddr="";
  if(isTwo){
    fromAddr=el("f-from-address").value.trim();toAddr=el("f-to-address").value.trim();
    if(!fromAddr){err.textContent=t.e_from;err.style.display="block";return;}
    if(!toAddr){err.textContent=t.e_to;err.style.display="block";return;}
    address=fromAddr;
  }else{
    address=el("f-address").value.trim();
    if(!address){err.textContent=t.e_addr;err.style.display="block";return;}
  }
  var branch=el("f-branch").value;
  if(!branch){err.textContent=t.e_branch;err.style.display="block";return;}
  if(!service){err.textContent=t.e_service;err.style.display="block";return;}
  var acRows=document.querySelectorAll("#ac-rows .ac-row");
  if(!acRows.length){err.textContent=t.e_ac1;err.style.display="block";return;}
  var acBad=false;
  acRows.forEach(function(r){
    var q=parseInt(r.querySelector(".ac-qty").value)||0;if(q<1)acBad=true;
    if(!r.querySelector(".ac-brand").value||!r.querySelector(".ac-hp").value||!r.querySelector(".ac-cool").value)acBad=true;
  });
  if(acBad){err.textContent=t.e_ac2;err.style.display="block";return;}
  var problem=el("f-problem").value.trim();
  if(!problem){err.textContent=t.e_problem;err.style.display="block";return;}
  var pdate=el("f-date").value;var ptime=el("f-time").value;
  if(!pdate){err.textContent=t.e_date;err.style.display="block";return;}
  if(!ptime){err.textContent=t.e_time;err.style.display="block";return;}
  var btn=el("submit-btn");btn.disabled=true;btn.textContent=t.sending;
  var row={customer_name:name,phone:phone,address:address,from_address:fromAddr||null,to_address:toAddr||null,
    branch:branch,service_type:service,problem:problem,ac_units:collectAc()||null,
    preferred_date:pdate,preferred_time:ptime,status:"new"};
  var r=await db.from("booking_requests").insert(row);
  if(r.error){err.textContent=t.e_err;err.style.display="block";btn.disabled=false;btn.textContent=t.submit;return;}
  el("form-area").style.display="none";el("ok-area").style.display="block";
}
